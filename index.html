<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>跳转中...</title>
    <script>
        // 你的目标网址
        var targetUrl = "https://shenlongma.de5.net";
        // 检测是否在微信内置浏览器
        function isWechat() {
            var ua = navigator.userAgent.toLowerCase();
            return ua.indexOf("micromessenger") !== -1;
        }
        if (isWechat()) {
            // 微信内：提示用户用浏览器打开
            document.body.innerHTML = "<p>请点击右上角，选择「在浏览器中打开」</p>";
        } else {
            // 非微信内：直接跳转
            window.location.href = targetUrl;
        }
    </script>
</head>
<body></body>
</html>
